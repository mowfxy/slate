<!doctype html>
<meta charset="utf-8">
<title>Fixture</title>
<script type="importmap">{"imports":{"gsap":"/engine/node_modules/gsap/index.js","gsap/":"/engine/node_modules/gsap/","three":"/engine/node_modules/three/build/three.module.js","three/addons/":"/engine/node_modules/three/examples/jsm/","slate":"/engine/runtime/slate.js"}}</script>
<style>
  html,body{margin:0;background:#000}
  [data-scene]{position:absolute;inset:0;display:grid;place-items:center}
  .box{width:200px;height:200px;background:#e33}
  h1{font:600 80px system-ui;color:#fff;margin:0}
</style>
<div data-stage>
  <section data-scene="a"><div class="box"></div></section>
  <section data-scene="b"><h1 id="t"></h1></section>
</div>
<script type="module">
import {film} from 'slate';
const F = film({fps: 10, width: 320, height: 180, bpm: 120});
F.scene('a', {start: 0, end: 1, energy: 0.3}, (tl, el) => {
  tl.fromTo(el.querySelector('.box'), {x: -100}, {x: 100, duration: 1, ease: 'none'});
});
F.scene('b', {start: 1, end: 2, kind: 'type', words: 'hi'}, () => {});
F.type(document.getElementById('t'), 'hi', {at: 1.1, cps: 10});
F.cue('resolve', 1.5).end(2);
await F.ready();
</script>
