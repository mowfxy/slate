<!--
  Dayline places a list of things into a day. The film is built from that one gesture: something
  lands in its slot, on the beat. The tasks land in the app, the words land on the cards, the week
  lands sixteenth by sixteenth, and the name lands last. Every product shot is the real app, recorded.
-->
<div data-stage>
  <div class="ground"></div>

  <section data-scene="place" class="shot"><video src="footage/place.webm" data-at="0" data-from="0" muted playsinline preload="auto"></video></section>
  <section data-scene="move" class="shot"><video src="footage/move.webm" data-at="0" data-from="0" muted playsinline preload="auto"></video></section>
  <section data-scene="week" class="shot"><video src="footage/week.webm" data-at="0" data-from="0" muted playsinline preload="auto"></video></section>

  <section data-scene="c-day" class="card"><h1>Nine things. One day.</h1></section>
  <section data-scene="c-change" class="card"><h1>Plans change.</h1></section>
  <section data-scene="c-week" class="card"><h1>So does the week.</h1></section>

  <section data-scene="mark" class="mark"><h1><span class="word">Dayline</span><span class="dot"></span></h1></section>
  <section data-scene="sign" class="sign"><p class="tagline">Your day, in place.</p></section>
</div>

<script type="module" src="film.js"></script>
