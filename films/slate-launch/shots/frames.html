<!doctype html>
<meta charset="utf-8">
<title>Frames</title>
<!-- The film's own frames (every 6th, from a draft render in build/frames) arriving one by one, the way the renderer
     captures them. Filmed by shots/frames.mjs. -->
<style>
  @font-face { font-family: 'Slate Mono'; src: url(/engine/runtime/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; color: #5f6670; font: 400 15px 'Slate Mono', monospace; }
  #wall { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 22px; padding: 56px 120px; will-change: transform; }
  figure { margin: 0; opacity: 0; transform: translateY(10px); transition: opacity .25s, transform .35s cubic-bezier(.2,.8,.2,1); }
  figure.on { opacity: 1; transform: none; }
  img { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 3px; box-shadow: 0 0 0 1px #1d2026; }
  figcaption { margin-top: 9px; font-size: 17px; font-variant-numeric: tabular-nums; }
  figure.last img { box-shadow: 0 0 0 2px #ff6a3d; }
</style>
<div id="wall"></div>
<script type="module">
  const N = 100, STEP = 12, wall = document.getElementById('wall');
  const figs = [];
  for (let i = 0; i < N; i++) {
    const f = document.createElement('figure');
    f.innerHTML = `<img src="/films/slate-launch/build/frames/f${String(i * 2).padStart(4, '0')}.jpg" alt=""><figcaption>${String(i * STEP).padStart(4, '0')}</figcaption>`;
    wall.append(f); figs.push(f);
  }
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  // frames land at the renderer's pace, and the wall rises to keep the newest row in view
  let n = 0, y = 0;
  window.start = (perSecond = 40) => {
    // the first rows are already in when the shot starts
    for (; n < 12; n++) figs[n].classList.add('on');
    const tick = () => {
      if (n >= N) return;
      figs[n - 1]?.classList.remove('last');
      figs[n].classList.add('on', 'last');
      n++;
      setTimeout(tick, 1000 / perSecond);
    };
    tick();
    const scroll = () => { const last = figs[Math.max(0, n - 1)]; const target = Math.max(0, last.offsetTop + last.offsetHeight + 80 - innerHeight); y += (target - y) * 0.08; wall.style.transform = `translateY(${-y}px)`; requestAnimationFrame(scroll); };
    scroll();
  };
</script>
